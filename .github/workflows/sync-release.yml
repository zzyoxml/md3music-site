name: Sync latest release

on:
  repository_dispatch:
    types: [md3music-release]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-release
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync release data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-release.mjs

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "已是最新版本，无需提交"
            exit 0
          fi
          VERSION=$(node -e "const s=require('fs').readFileSync('index.html','utf8');console.log((s.match(/data-latest-version>([^<]+)/)||[])[1]||'latest')")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 同步官网版本 ${VERSION}"
          git push
